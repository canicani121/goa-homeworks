<!-- Block level ელემენტები – იკავებს მთლიან ხაზს და შემდეგი ელემენტი გადადის ახალ ხაზზე.
მაგალითი: <p>, <div>, <h1>

Inline ელემენტები – იკავებს მხოლოდ იმდენ ადგილს რამდენიც სჭირდება და არ იწყებს ახალ ხაზს.
მაგალითი: <b>, <i>, <span> -->


<p>ეს არის ჩემი პატარა <b>საიტის</b> მაგალითი</p>


<p>random</p>
<button>click</button>
<i>italic</i>
