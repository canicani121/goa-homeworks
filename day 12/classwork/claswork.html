<form>
    <input type="text" placeholder="name">
    <input type="email" placeholder="email">
    <input type="password" placeholder="password">
    <label>male:</label>
    <input type="checkbox">
    <textarea rows="5" cols="50"></textarea>
    <input type="radio">
    <button type="submit">subtim</button>
</form>


<!-- text – ჩვეულებრივი ტექსტის ჩასაწერად -->
<input type="text">

<!-- password – პაროლის ჩასაწერად (ტექსტი იფარება) -->
<input type="password">

<!-- email – ელფოსტის მისამართის ჩასაწერად -->
<input type="email">

<!-- number – მხოლოდ რიცხვების ჩასაწერად -->
<input type="number">

<!-- checkbox – მონიშვნა (კი / არა) -->
<input type="checkbox">

<!-- radio – ერთის არჩევა რამდენიმე ვარიანტიდან -->
<input type="radio"

<!-- submit – ფორმის გაგზავნის ღილაკი -->
<input type="submit">

<!-- reset – ფორმის გასუფთავება -->
<input type="reset">
